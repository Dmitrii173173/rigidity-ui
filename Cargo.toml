[workspace]

[package]
name        = "rigidity-ui"
description = "A viewer for rigidity: register two clouds and see which degrees of freedom the geometry determined."
version      = "0.1.0"
edition      = "2024"
# Matches ../rigidity/rust-toolchain.toml. The numbers this shows are
# produced by the same compiler that produced the ones the CLI prints, or
# they are not the same numbers.
rust-version = "1.97"
# The same licence as ../rigidity, AGPL-3.0 alone, and not a choice this crate
# could make on its own: it links those crates directly. See
# LICENSING.md.
license      = "AGPL-3.0-only"
publish      = false

[dependencies]
# Path dependencies, deliberately — not for want of an alternative.
# `rigidity` is published (0.1.1) and has a remote, so a version dependency
# would resolve; stage 3 develops `rigidity-graph` upstream and calls it
# from here in the same sitting, and a pinned version would need a publish
# between every two edits. CI checks the two repositories out side by side
# instead. See PLAN.md §10.
rigidity-core     = { path = "../rigidity/crates/rigidity-core" }
rigidity-io       = { path = "../rigidity/crates/rigidity-io" }
# Scenes with analytically known null spaces: the built-in demos, and the
# fixtures the parity tests generate rather than read (the demo clouds in
# ../rigidity are gitignored, and a test that skips when its input is
# missing is a test that passes for the wrong reason).
rigidity-scenes   = { path = "../rigidity/crates/rigidity-scenes" }
rigidity-pipeline = { path = "../rigidity/crates/rigidity-pipeline" }
# The index, used directly for cloud-to-cloud distance: that question is
# about every point of both clouds, not about the downsampled surfaces the
# pipeline prepares for the solver.
rigidity-spatial  = { path = "../rigidity/crates/rigidity-spatial" }
# The survey: nodes, edges, and Gauss-Newton over them. The weighting that
# makes it worth having is upstream too — this crate contributes the screen
# and nothing whose test would mention a matrix.
rigidity-graph    = { path = "../rigidity/crates/rigidity-graph" }

# One dependency for the whole UI and GPU stack: eframe re-exports the
# `egui`, `egui_wgpu` and `wgpu` it was built against, so those three can
# never drift out of step with each other or with us.
eframe = "0.36"

# Vertex and uniform structs go to the GPU as bytes.
bytemuck = { version = "1.25", features = ["derive"] }

# The system file dialog. Nothing else in the application opens a window.
rfd = "0.17"

# No `nalgebra` entry, deliberately: `rigidity_core::nalgebra` (§7.3) is the
# same crate, and a matrix reaches a uniform through `as_slice()`, which is
# already column-major and needs no bytemuck conversion at all.

[lints.rust]
unsafe_code     = "forbid"
unreachable_pub = "warn"

# Numerical code in a debug build is unusable: preparing a million points
# would take minutes. Dependencies are optimised, our own code is not, so
# the crate still builds fast and still steps in a debugger.
[profile.dev.package."*"]
opt-level = 2
