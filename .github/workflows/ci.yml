name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: rigidity-ui

      # This crate depends on ../rigidity by path, so the sibling has to be
      # beside it. The address is a repository variable rather than a name
      # written here: the core has no remote yet, and inventing one would
      # produce a workflow that looks configured and is not.
      - name: where is rigidity?
        shell: bash
        run: |
          if [ -z "${{ vars.RIGIDITY_REPOSITORY }}" ]; then
            echo "::error::Set the repository variable RIGIDITY_REPOSITORY to"
            echo "::error::the owner/name of the rigidity core repository."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.RIGIDITY_REPOSITORY }}
          path: rigidity

      # Installs whatever rust-toolchain.toml names — 1.97.1, the same
      # compiler the core is built with. Naming the version here as well
      # would be a second place for it to drift.
      - name: toolchain
        working-directory: rigidity-ui
        run: rustup show

      # eframe links against the window system even to build.
      - name: linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev

      - name: fmt
        working-directory: rigidity-ui
        run: cargo fmt --all --check

      - name: clippy
        working-directory: rigidity-ui
        run: cargo clippy --all-targets -- -D warnings

      # No window is opened: every test is about the pipeline, the palette
      # or the demo scenes, so a headless runner is enough. The two parity
      # tests build the core's command line and compare its printed report
      # with the viewer's, which is why the checkout above matters.
      - name: test
        working-directory: rigidity-ui
        run: cargo test

  bundle:
    name: macOS application
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rigidity-ui
      - name: where is rigidity?
        shell: bash
        run: |
          if [ -z "${{ vars.RIGIDITY_REPOSITORY }}" ]; then
            echo "::error::Set the repository variable RIGIDITY_REPOSITORY."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.RIGIDITY_REPOSITORY }}
          path: rigidity
      - name: toolchain
        working-directory: rigidity-ui
        run: rustup show
      - name: bundle
        working-directory: rigidity-ui
        run: ./package/macos.sh
      # Unsigned, so it is quarantined on any machine that did not build
      # it: the first launch needs a right-click and Open. Signing needs a
      # paid identity this project does not have.
      - uses: actions/upload-artifact@v4
        with:
          name: rigidity-macos
          path: rigidity-ui/build/rigidity.app
